name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import resources
        run: ./godot --headless --path . --import
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/test_runner.gd